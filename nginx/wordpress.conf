server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/wordpress;
    index index.php index.html;

    # Main routing for WordPress Permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP processing via PHP-FPM socket
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }

    # SECURITY: Block XML-RPC (DDoS and Brute-force protection)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SECURITY: Disable PHP execution inside the uploads directory
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # SECURITY: Deny access to hidden files (.htaccess, .git, etc.)
    location ~ /\.ht {
        deny all;
    }

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
    }
}
