server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/wordpress;
    index index.php index.html;

    # Основная маршрутизация для ЧПУ (Permalinks)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Обработка PHP через сокет PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }

    # БЕЗОПАСНОСТЬ: Блокировка XML-RPC (защита от DDoS и Brute-force)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # БЕЗОПАСНОСТЬ: Запрет исполнения PHP в папке загрузок
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # БЕЗОПАСНОСТЬ: Запрет доступа к скрытым файлам (.htaccess, .git)
    location ~ /\.ht {
        deny all;
    }

    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
